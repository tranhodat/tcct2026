<title>K02A02 Notebook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* Layout: ô-ly notebook header with red margin rule, sticky tab strip, one working view below.
   Palette: ink-blue pen, red margin pen, highlighter yellow for today. */
:root{
  --bg:#F4F6FB; --surface:#FFFFFF; --ink:#14213D; --muted:#5A6684; --line:#DCE1EE; --grid:#E6EBF6;
  --accent:#2446C9; --accent-ink:#FFFFFF; --accent-soft:#E6ECFF;
  --red:#C73A2D; --red-soft:#FCE9E6;
  --teal:#0C7F62; --teal-soft:#DDF3EC;
  --hl:#FFE680; --hl-ink:#14213D;
  --scrim:rgba(10,15,35,.52);
  --shadow:0 1px 2px rgba(20,33,61,.06),0 10px 28px rgba(20,33,61,.10);
  --f-display:'Bricolage Grotesque','Be Vietnam Pro',system-ui,sans-serif;
  --f-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1322; --surface:#161D33; --ink:#E7EBF8; --muted:#9AA4C4; --line:#2A3354; --grid:#1D2644;
    --accent:#8FA5FF; --accent-ink:#0E1322; --accent-soft:#222C57;
    --red:#FF8B7B; --red-soft:#3A2024;
    --teal:#5FD6B1; --teal-soft:#143229;
    --hl:#E8CB4E; --hl-ink:#1A1500;
    --scrim:rgba(0,0,0,.62);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1322; --surface:#161D33; --ink:#E7EBF8; --muted:#9AA4C4; --line:#2A3354; --grid:#1D2644;
  --accent:#8FA5FF; --accent-ink:#0E1322; --accent-soft:#222C57;
  --red:#FF8B7B; --red-soft:#3A2024;
  --teal:#5FD6B1; --teal-soft:#143229;
  --hl:#E8CB4E; --hl-ink:#1A1500;
  --scrim:rgba(0,0,0,.62);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.hero{background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;border-bottom:1px solid var(--line)}
.hero .wrap{padding-block:26px 20px}
.hero-row{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;border-left:3px solid var(--red);padding-left:14px}
.hero-txt{min-width:0}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hero h1{font-size:clamp(26px,5vw,40px);margin-top:4px;overflow-wrap:anywhere}
.hero h1.unset{color:var(--muted)}
.hero-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.role{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--line)}
.role i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.role.admin i{background:var(--red)}.role.officer i{background:var(--accent)}.role.member i{background:var(--teal)}


.tab[data-tab="aitools"]{--tab-tint:#9c71ed}
.ai-tools-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.ai-tools-head h2{margin:0 0 6px}.ai-tools-head p{margin:0;color:var(--muted)}
.ai-tools-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
.ai-tool{--tool-color:#8845ff;display:flex;flex-direction:column;min-width:0;padding:28px;border:1px solid var(--line);border-top:3px solid var(--tool-color);border-radius:22px;background:var(--surface);box-shadow:0 8px 28px #172e6810}
.ai-tool:nth-child(8n+2){--tool-color:#2962ff}.ai-tool:nth-child(8n+3){--tool-color:#009bbb}.ai-tool:nth-child(8n+4){--tool-color:#009b70}.ai-tool:nth-child(8n+5){--tool-color:#ff1452}.ai-tool:nth-child(8n+6){--tool-color:#ff5900}.ai-tool:nth-child(8n+7){--tool-color:#a02cff}.ai-tool:nth-child(8n+8){--tool-color:#36445b}
.ai-tool-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.ai-tool-icon{width:66px;height:66px;border:1px solid var(--line);border-radius:18px;display:grid;place-items:center;font-size:38px;color:var(--tool-color);flex-shrink:0}.ai-tool-category{padding:8px 11px;border-radius:24px;background:color-mix(in srgb,var(--tool-color) 10%,var(--surface));color:var(--tool-color);font-size:11px;font-weight:600;text-align:center}.ai-tool h3{font-size:21px;margin:0 0 12px;overflow-wrap:anywhere}.ai-tool p{color:var(--muted);line-height:1.7;margin:0 0 24px;min-height:54px;white-space:pre-wrap;overflow-wrap:anywhere}.ai-tool-link{display:flex;justify-content:space-between;gap:12px;margin-top:auto;padding-top:22px;border-top:1px solid var(--line);color:var(--tool-color);font-weight:600;text-decoration:none;overflow-wrap:anywhere}.ai-tool-link:hover{text-decoration:underline}.ai-tool-link:focus-visible{outline:2px solid var(--tool-color);outline-offset:5px}.ai-tool-actions{display:flex;gap:8px;margin-top:16px}
@media(max-width:1100px){.ai-tools-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.ai-tools-grid{grid-template-columns:1fr}.ai-tool{padding:24px}.ai-tools-head{align-items:flex-start;flex-direction:column}}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs-in{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
/* Blend each tab color with the current surface to keep both themes soft. */
.tab{--tab-tint:#6695E8;appearance:none;background:var(--surface);background:color-mix(in srgb,var(--tab-tint) 14%,var(--surface));border:0;border-bottom:3px solid transparent;border-radius:10px 10px 0 0;padding:13px 14px 10px;cursor:pointer;color:var(--ink);font-weight:600;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab[data-tab="lich"]{--tab-tint:#6695E8}
.tab[data-tab="thongbao"]{--tab-tint:#E9B453}
.tab[data-tab="tailieu"]{--tab-tint:#62B899}
.tab[data-tab="hocphan"]{--tab-tint:#A38ADD}
.tab[data-tab="hinhanh"]{--tab-tint:#DD8FAD}
.tab[data-tab="baocao"]{--tab-tint:#E4A078}
.tab[data-tab="ykien"]{--tab-tint:#5DB7C6}
.tab[data-tab="danhsach"]{--tab-tint:#A0B86B}
.tab:hover{background:var(--accent-soft);background:color-mix(in srgb,var(--tab-tint) 23%,var(--surface))}
.tab[aria-selected="true"]{background:var(--accent-soft);background:color-mix(in srgb,var(--tab-tint) 30%,var(--surface));color:var(--accent);border-bottom-color:var(--accent)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
:root[data-theme="dark"] .badge{color:#2A0E0A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge{color:#2A0E0A}}

main .wrap{padding-block:22px 72px}
.notice{padding:12px 14px;border:1px dashed var(--line);border-radius:10px;background:var(--surface);color:var(--muted);margin-bottom:16px}
.notice.warn{border-color:var(--red);color:var(--ink)}

/* buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;min-height:38px}
.btn:hover{border-color:var(--accent)}
.btn[data-act="exportCourseWord"]{background:#B22222;border-color:#B22222;color:#fff}
.btn[data-act="exportCourseWord"]:hover{filter:brightness(1.08)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.danger.solid{background:var(--red);color:#fff}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn[disabled]{opacity:.6;cursor:progress}
.link-btn{appearance:none;border:0;background:none;color:var(--accent);cursor:pointer;padding:2px 4px;font-weight:600;font-size:13px}
.link-btn.red{color:var(--red)}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.bar h2{font-size:22px}
.bar .grow{flex:1;min-width:0}
.sub{color:var(--muted);font-size:14px}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.teal{background:var(--teal-soft);color:var(--teal)}
.tag.hl{background:var(--hl);color:var(--hl-ink)}
.tag.plain{background:var(--bg);color:var(--muted);border:1px solid var(--line)}

/* empty */
.empty{border:1px dashed var(--line);border-radius:12px;padding:28px 20px;text-align:center;color:var(--muted);background:var(--surface)}
.empty h3{color:var(--ink);font-size:18px;margin-bottom:6px}
.empty .btn{margin-top:14px}

/* calendar */
.cal-layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
@media (max-width:900px){.cal-layout{grid-template-columns:minmax(0,1fr)}}
.cal-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cal-head h2{font-size:24px;margin-right:auto;font-variant-numeric:tabular-nums}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dow{background:var(--surface);text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding:8px 0;letter-spacing:.04em}
.dow:last-child{color:var(--red)}
.day{appearance:none;border:0;background:var(--surface);text-align:left;cursor:pointer;min-height:96px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.day:hover{background:var(--accent-soft)}
.day.out{background:var(--bg);color:var(--muted)}
.day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.day .n{width:26px;height:26px;display:grid;place-items:center;border-radius:50%;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.day.today .n{background:var(--hl);color:var(--hl-ink)}
.chips{display:flex;flex-direction:column;gap:2px;min-width:0}
.chip{display:block;font-size:11.5px;line-height:1.35;padding:2px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{font-size:11px;color:var(--muted);padding-left:2px}
.dots{display:none;gap:4px;flex-wrap:wrap}
.t-hoc{background:var(--accent-soft);color:var(--accent)}
.t-hd{background:var(--teal-soft);color:var(--teal)}
.t-han{background:var(--red-soft);color:var(--red)}
.dot{width:8px;height:8px;display:inline-block;background:currentColor}
.dot.t-hoc{border-radius:50%;background:var(--accent)}
.dot.t-hd{border-radius:2px;background:var(--teal)}
.dot.t-han{transform:rotate(45deg);background:var(--red)}
@media (max-width:640px){
  .day{min-height:58px;padding:4px;align-items:center}
  .chips{display:none}.dots{display:flex;justify-content:center}
}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel+.panel{margin-top:16px}
.panel h3{font-size:17px;margin-bottom:2px}
.panel .kicker{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-bottom:6px}
.ev{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.ev:first-of-type{border-top:0}
.ev time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);font-weight:600;line-height:1.4}
.ev h4{font-size:15px;font-family:var(--f-body);font-weight:600;overflow-wrap:anywhere}
.ev p{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.ev .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.ev-acts{display:flex;flex-direction:column;align-items:flex-end}
.up{display:grid;grid-template-columns:46px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.up:first-of-type{border-top:0}
.dbox{border:1px solid var(--line);border-radius:8px;text-align:center;padding:3px 0;background:var(--bg);line-height:1.2}
.dbox b{display:block;font-size:18px;font-family:var(--f-display);font-variant-numeric:tabular-nums}
.dbox small{font-size:11px;color:var(--muted);text-transform:uppercase}
.up h4{font-family:var(--f-body);font-size:14px;font-weight:600;overflow-wrap:anywhere}
.up p{font-size:13px;color:var(--muted)}

/* announcements */
.ann-list{display:flex;flex-direction:column;gap:14px;max-width:780px}
.ann{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.ann.pinned{border-color:var(--accent)}
.ann.imp{border-left:4px solid var(--red)}
.ann h3{font-size:18px;overflow-wrap:anywhere}
.ann .head{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.ann .body{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:6px}
.ann .foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:10px}
.ann .foot .sp{flex:1}

/* docs */
.split{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.split{grid-template-columns:minmax(0,1fr)}}
.folders{display:flex;flex-direction:column;gap:2px}
@media (max-width:760px){.folders{flex-direction:row;overflow-x:auto;padding-bottom:4px}}
.folder{appearance:none;border:0;background:none;text-align:left;cursor:pointer;padding:9px 12px;border-radius:9px;display:flex;justify-content:space-between;gap:10px;font-weight:500;white-space:nowrap}
.folder:hover{background:var(--accent-soft)}
.folder[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.folder .c{font-variant-numeric:tabular-nums;opacity:.75;font-size:13px}
.files{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.file{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.file:first-child{border-top:0}
.ext{font-size:11px;font-weight:700;letter-spacing:.04em;text-align:center;padding:6px 0;border-radius:7px;background:var(--accent-soft);color:var(--accent)}
.ext.LINK{background:var(--teal-soft);color:var(--teal)}
.ext.PDF{background:var(--red-soft);color:var(--red)}
.file .nm{font-weight:600;overflow-wrap:anywhere;text-decoration:none;color:var(--ink)}
.file a.nm:hover{color:var(--accent);text-decoration:underline}
.file .mt{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lst{list-style:none;margin:0;padding:0}
.lst .file{padding:9px 0;grid-template-columns:48px minmax(0,1fr) auto}

/* courses */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{appearance:none;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0}
.card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.card h3{font-size:18px;overflow-wrap:anywhere}
.card .sub{overflow-wrap:anywhere}
.lec-layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.lec-layout{grid-template-columns:minmax(0,1fr)}}
.lec-nav{display:flex;flex-direction:column;gap:2px;counter-reset:l}
.lec-btn{appearance:none;border:0;background:none;text-align:left;cursor:pointer;padding:10px 12px;border-radius:9px;display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;align-items:start}
.lec-btn:hover{background:var(--accent-soft)}
.lec-btn[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.lec-btn .no{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;opacity:.75;color:inherit}
.lec-btn span:last-child{overflow-wrap:anywhere}
.sect{margin-top:22px}
.sect:first-of-type{margin-top:12px}
.sect-h{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px;border-bottom:1px solid var(--line);padding-bottom:6px}
.sect-h h4{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-family:var(--f-body);font-weight:600}
.expand-content[open]>summary .expand-preview,.expand-content[open]>summary .expand-more{display:none}.expand-less{display:none}.expand-content[open]>summary .expand-less{display:inline}
.lecture-note{margin-bottom:14px}.lecture-note summary{cursor:pointer;overflow-wrap:anywhere;padding:10px;background:var(--bg);border-radius:8px}.lecture-note .acts{margin-top:6px}
.note{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border-left:3px solid var(--hl);padding:10px 14px;border-radius:0 8px 8px 0}
.review-question{padding:16px;border:1px solid #cfe8d9;border-radius:12px;background:var(--surface)}.review-field+.review-field{margin-top:16px}.review-label{display:inline-flex;align-items:center;gap:7px;margin-bottom:8px;padding:4px 10px;border-radius:6px;background:#2844d6;color:#fff;font-size:13px;font-weight:700;line-height:1.5}.review-label::before{content:'';width:6px;height:6px;border-radius:50%;background:#c9d2ff}.review-question .note{border-left-color:#78bd90}.review-question .expand-more,.review-question .expand-less{color:#20663d;font-weight:600}
.muted{color:var(--muted)}
.acts{display:flex;gap:6px;flex-wrap:wrap}

/* albums */
.album{appearance:none;padding:0;overflow:hidden;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;display:flex;flex-direction:column;min-width:0}
.album:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.cover{aspect-ratio:4/3;background:repeating-linear-gradient(135deg,var(--bg) 0 10px,var(--grid) 10px 20px);display:block;width:100%;object-fit:cover;max-width:100%}
.album .in{padding:12px 14px;display:flex;flex-direction:column;gap:2px}

}

function friendly(e){
  const c=e&&e.code;
  if(c==='invalid_argument'){if(S.role==='unknown'){S.ro=true;sched()}return 'Bạn chưa có quyền thực hiện thao tác này. Cần quyền Cán bộ lớp hoặc Quản trị.'}
  if(c==='quota_exceeded')return 'Kho dữ liệu của trang đã đầy. Hãy xoá bớt nội dung cũ.';
  if(c==='resource_exhausted'||c==='rate_limited')return 'Thao tác quá nhanh, hãy thử lại sau vài giây.';
  if(c==='unavailable'||c==='store_unavailable')return 'Hệ thống đang bận, hãy thử lại sau ít phút.';
  if(c==='too_large')return 'Tệp quá lớn (tối đa 3 MB mỗi tệp).';
  if(c==='unsupported_type')return 'Định dạng tệp này chưa được hỗ trợ.';
  if(c==='quota_or_state')return 'Dung lượng lưu trữ của trang đã đầy.';
  if(c==='revoked')return 'Quyền truy cập đã thay đổi. Hãy tải lại trang.';
  return (e&&e.message)||'Có lỗi xảy ra, hãy thử lại.';
}

function persistState(){
 const payload=clone(sharedSnapshot()),pendingId=uid();
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify({...payload,updatedAt:Date.now()}));localStorage.setItem('solop.pendingState',JSON.stringify({id:pendingId,state:payload}));}catch(e){throw new Error('Không lưu được bản dự phòng trên máy.');}

  try{
   if(!syncState.ready)throw new Error('Chưa tải được dữ liệu chung. Hãy tắt Edit mode và đồng bộ lại.');
   const r=await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json','X-Edit-Password':G.token},body:JSON.stringify({state:payload,revision:syncState.revision})});
   const data=await r.json();if(!r.ok)throw new Error(data.message||'Không đồng bộ được dữ liệu lên server.');
   auditNotice(r);syncState.revision=data.revision;syncState.error='';
   const pending=readLocalJson('pendingState',null);
   if(pending?.id===pendingId){localStorage.setItem('solop.pendingState','null');localStorage.setItem(STORAGE_KEY,JSON.stringify(data.state));}
  }catch(e){syncState.error=e.message;sched();throw e;}
 });
}
async function syncShared(){
 if(syncState.busy)return false;syncState.busy=true;
 try{
  const r=await fetch('/api/state',{cache:'no-store'});const data=await r.json();if(!r.ok)throw new Error(data.message||'Không tải được dữ liệu chung.');
  const changed=data.revision!==syncState.revision;
  {
   data.state=data.state||{events:[],anns:[],folders:[],docs:[],courses:[],albums:[],cls:{}};
   const local=localStorage.getItem(STORAGE_KEY);
   if(!syncState.ready&&local){let previous;try{previous=JSON.parse(local)||{}}catch{previous={}}if(JSON.stringify(previous.docs)!==JSON.stringify(data.state.docs)||JSON.stringify(previous.courses)!==JSON.stringify(data.state.courses)||JSON.stringify(previous.albums)!==JSON.stringify(data.state.albums))localStorage.setItem('solop.recoveryState',local);}
   localStorage.setItem(STORAGE_KEY,JSON.stringify(data.state));loadState();
  }
  syncState.revision=data.revision;syncState.ready=true;syncState.error='';return changed;
 }catch(e){syncState.error=e.message;return false;}finally{syncState.busy=false;sched();}
}

}

function guessType(f){
  if(OK_TYPES.indexOf(f.type)>=0)return f.type;
  const ext=(f.name.split('.').pop()||'').toLowerCase();
  if(EXT[ext])return EXT[ext];
  const err=new Error('Không thể tải lên tệp “'+f.name+'”. Chỉ nhận PDF, ảnh, video MP4/WebM, CSV, TXT, Markdown, JSON. Với Word, PowerPoint, Excel hãy xuất sang PDF hoặc dùng “Thêm liên kết”.');
  throw err;
}
async function shrink(f){
  if(!/^image\/(jpeg|png|webp)$/.test(f.type))return f;
  try{
    const bmp=await createImageBitmap(f);
    const sc=Math.min(1,1800/Math.max(bmp.width,bmp.height));
    if(sc===1&&f.size<1500000)return f;
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.86));
    return(b&&b.size<f.size)?b:f;
  }catch(e){return f}
}
async function upload(f,image,context={}){
  if(f.size>MAX_UPLOAD_BYTES)throw Object.assign(new Error('Tệp quá lớn.'),{code:'too_large'});
  const g=githubSettings();
  let type=guessType(f),blob=f;
  if(image){
    if(type.indexOf('image/')!==0)throw new Error('“'+f.name+'” không phải là ảnh.');
    blob=await shrink(f);if(blob!==f)type='image/jpeg';
  }
  const path=uploadPath(f.name,context,blob!==f);
  const reader=new FileReader();
  const dataUrl=await new Promise((resolve,reject)=>{reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('Không thể đọc tệp.'));reader.readAsDataURL(blob);});
  const content=String(dataUrl).split(',')[1];
  const result=await enqueue('github-write',()=>githubRequest(g,contentUrl(g,path),{method:'PUT',body:JSON.stringify({message:'Upload '+path,branch:g.branch,content})}));
  if(!result.content?.path)throw new Error('GitHub chưa xác nhận tệp đã lưu.');
  const url=result.content.download_url||'https://raw.githubusercontent.com/'+g.repo+'/'+encodeURIComponent(g.branch)+'/'+path.split('/').map(encodeURIComponent).join('/');
  return {id:url,path,sizeBytes:blob.size||0,contentType:type};
}

function fieldHtml(f){
  const id='f_'+f.name,v=f.value==null?'':f.value;let ctl;
  if(f.type==='checkbox')return '<div class="field check"><input type="checkbox" id="'+id+'" name="'+f.name+'"'+(f.value?' checked':'')+'><label for="'+id+'">'+esc(f.label)+'</label></div>';
  if(f.type==='textarea')ctl='<textarea id="'+id+'" name="'+f.name+'" rows="'+(f.rows||4)+'" placeholder="'+esc(f.placeholder||'')+'">'+esc(v)+'</textarea>';
  else if(f.type==='richtext')ctl=richEditorHtml(id,f);
  else if(f.type==='select')ctl='<select id="'+id+'" name="'+f.name+'">'+f.options.map(o=>'<option value="'+esc(o[0])+'"'+(String(o[0])===String(v)?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select>';
  else if(f.type==='file')ctl='<input id="'+id+'" name="'+f.name+'" type="file"'+(f.multiple?' multiple':'')+' accept="'+esc(f.accept||'')+'">';
  else ctl='<input id="'+id+'" name="'+f.name+'" type="'+(f.type||'text')+'" value="'+esc(v)+'" placeholder="'+esc(f.placeholder||'')+'"'+(f.min!=null?' min="'+f.min+'"':'')+(f.max!=null?' max="'+f.max+'"':'')+' autocomplete="off">';
  return '<div class="field'+(f.half?' half':'')+'"><label for="'+id+'">'+esc(f.label)+(f.required?' <span class="req">*</span>':'')+'</label>'+ctl+(f.hint?'<small>'+esc(f.hint)+'</small>':'')+'</div>';
}

function openForm(o){
  const m=$('#modal');
  m.innerHTML='<div class="scrim" data-act="closeModal"></div><form class="sheet" id="mform" novalidate role="dialog" aria-modal="true" aria-labelledby="mtitle"><h2 id="mtitle">'+esc(o.title)+'</h2>'+(o.intro?'<p class="intro">'+esc(o.intro)+'</p>':'')+(o.fields||[]).map(fieldHtml).join('')+'<p class="err" id="merr" role="alert" hidden></p><div class="sheet-actions"><button type="button" class="btn ghost" data-act="closeModal">Huỷ</button><button class="btn '+(o.danger?'danger solid':'primary')+'" type="submit" id="msubmit">'+esc(o.submit||'Lưu')+'</button></div></form>';
  m.hidden=false;document.body.classList.add('lock');
  const form=$('#mform'),btn=$('#msubmit'),err=$('#merr');
  setupRichEditors(form);
  const first=form.querySelector('input:not([type=checkbox]),textarea,select');if(first)first.focus();
  form.addEventListener('submit',async ev=>{
    ev.preventDefault();err.hidden=true;
    const vals={};
    for(const f of(o.fields||[])){
      const el=f.type==='richtext'?form.querySelector('#f_'+f.name):form.elements[f.name];
      if(f.type==='richtext'){vals[f.name]=el.innerText.trim();vals[f.name+'Html']=sanitizeAnswerHtml(el.innerHTML);}
      else if(f.type==='file')vals[f.name]=[...el.files];
      else if(f.type==='checkbox')vals[f.name]=el.checked;
      else vals[f.name]=f.type==='password'?el.value:(el.value||'').trim();
      const empty=f.type==='file'?!vals[f.name].length:vals[f.name]==='';
      if(f.required&&empty){err.textContent='Vui lòng '+(f.type==='file'?'chọn':'nhập')+' “'+f.label+'”.';err.hidden=false;el.focus();return}
    }
    const label=btn.textContent;btn.disabled=true;
    try{await o.onSubmit(vals,t=>{btn.textContent=t});closeModal();render()}
    catch(e){err.textContent=friendly(e);err.hidden=false;btn.disabled=false;btn.textContent=label}
  });
}

function occurrences(){
  const out=[];
  for(const e of S.events){
    if(!e.date)continue;
    const w=Math.max(1,Math.min(52,+e.weeks||1));
    for(let k=0;k<w;k++)out.push(Object.assign({},e,{date:addDays(e.date,7*k),k,w}));
  }
  return out;
}

function sanitizeAnswerHtml(value){
 const template=document.createElement('template');template.innerHTML=String(value||'');const root=template.content;
 const allowed=new Set(['B','STRONG','I','EM','U','P','DIV','BR','SPAN','FONT','UL','OL','LI']);
 function clean(node){
  if(node.nodeType===3)return esc(node.nodeValue);
  if(node.nodeType!==1||['SCRIPT','STYLE','IFRAME','OBJECT','SVG','MATH','TEMPLATE'].includes(node.tagName))return '';
  const body=Array.from(node.childNodes).map(clean).join('');if(!allowed.has(node.tagName))return body;
  const styles=[],style=node.style;
  const color=style.color||(node.tagName==='FONT'?node.getAttribute('color'):'');
  if(color&&/^(#[0-9a-f]{3,8}|[a-z]+|rgba?\([\d.,%\s]+\))$/i.test(color))styles.push('color:'+color);
  const align=style.textAlign||node.getAttribute('align');if(['left','right','center','justify'].includes(align))styles.push('text-align:'+align);
  if(/^(bold|[6-9]00)$/.test(style.fontWeight))styles.push('font-weight:'+style.fontWeight);
  if(style.fontStyle==='italic')styles.push('font-style:italic');
  if((style.textDecorationLine||style.textDecoration||'').includes('underline'))styles.push('text-decoration:underline');
  const tag=node.tagName==='FONT'?'span':node.tagName.toLowerCase();
  return '<'+tag+(styles.length?' style="'+esc(styles.join(';'))+'"':'')+'>'+body+(tag==='br'?'':'</'+tag+'>');
 }
 return Array.from(root.childNodes).map(clean).join('');
}

function wordParagraphs(markup){
 const template=document.createElement('template');template.innerHTML=markup;
 function render(nodes){
  let result='',line='';
  const flush=()=>{if(line.replace(/<[^>]*>/g,'').trim())result+='<p>'+line+'</p>';line='';};
  function walk(node,wrappers=[]){
   if(node.nodeType===3){
    node.nodeValue.split(/\r\n?|\n|\u2028|\u2029/).forEach((part,i)=>{
     if(i)flush();const value=esc(part.replace(/[\t\u00a0\u2007\u202f ]+/g,' '));
     if(value)line+=wrappers.reduceRight((body,tag)=>tag.open+body+tag.close,value);
    });return;
   }
   if(node.nodeType!==1)return;
   if(node.tagName==='BR'){flush();return;}
   if(['P','DIV'].includes(node.tagName)){
    flush();const span=document.createElement('span');span.style.cssText=node.style.cssText;span.style.removeProperty('text-align');
    const formatted=span.getAttribute('style')?[...wrappers,{open:span.outerHTML.match(/^<[^>]+>/)[0],close:'</span>'}]:wrappers;
    Array.from(node.childNodes).forEach(child=>walk(child,formatted));flush();return;
   }
   if(['UL','OL'].includes(node.tagName)){flush();const tag=node.tagName.toLowerCase();result+='<'+tag+'>'+Array.from(node.children).map(li=>'<li>'+render(Array.from(li.childNodes))+'</li>').join('')+'</'+tag+'>';return;}
   const clone=node.cloneNode(false);clone.style.removeProperty('text-align');
   const tag=node.tagName.toLowerCase(),open=clone.outerHTML.match(/^<[^>]+>/)[0];
   Array.from(node.childNodes).forEach(child=>walk(child,[...wrappers,{open,close:'</'+tag+'>'}]));
  }
  nodes.forEach(node=>walk(node));flush();return result;
 }
 return render(Array.from(template.content.childNodes));
}

function recoveryPlan(){
 const pending=JSON.parse(localStorage.getItem('solop.pendingState')||'null');
 const backup=pending?.state||readLocalJson('recoveryState',null);
 const added=[];
 function merge(current,old){
  const out=clone(current||[]);
  for(const entry of old||[]){if(!entry||typeof entry!=='object')continue;const identity=e=>e.id||e.assetId||e.githubPath||e.link;const key=identity(entry);if(!key)continue;const match=out.find(e=>identity(e)===key);
   if(!match){out.push(clone(entry));added.push(entry.name||entry.title||'Tệp đính kèm');}
   else for(const field of Object.keys(entry))if(Array.isArray(entry[field])&&Array.isArray(match[field]))match[field]=merge(match[field],entry[field]);
  }return out;
 }
 const state=clone(sharedSnapshot());if(backup)for(const key of ['events','anns','folders','docs','courses','albums'])state[key]=merge(state[key],backup[key]);return {state,added};
}

function feedbackCard(c){
 const chars=Array.from(c.text),long=chars.length>200,voted=store.get('commentVote.'+c.id)==='yes',pending=feedback.pending.has(c.id);
 return '<article class="feedback-card comment-card"><button class="comment-vote'+(voted?' voted':'')+'" data-act="commentVote" data-id="'+esc(c.id)+'" aria-pressed="'+voted+'" aria-label="'+(voted?'Bỏ vote':'Vote ý kiến')+'" '+(pending?'disabled':'')+'><span class="vote-star" aria-hidden="true">'+(voted?'★':'☆')+'</span><span class="vote-count">'+(Number(c.votes)||0)+'</span></button><div><div class="feedback-meta"><strong>'+esc(c.name)+'</strong><time>'+esc(stamp(c.createdAt))+'</time>'+(W()||store.get('commentOwned.'+c.id)==='yes'?'<button class="link-btn" data-act="commentEdit" data-id="'+esc(c.id)+'" '+(pending?'disabled':'')+'>Sửa</button>':'')+(W()||store.get('commentOwned.'+c.id)==='yes'?'<button class="link-btn red comment-delete" data-act="commentDelete" data-id="'+esc(c.id)+'" '+(pending?'disabled':'')+'>Xoá</button>':'')+'</div>'+(long?'<details class="comment-text expand-content"><summary><span class="expand-preview">'+esc(chars.slice(0,200).join(''))+'… </span><span class="comment-expand expand-more">Xem thêm</span><span class="comment-expand expand-less">Thu gọn</span></summary><p>'+esc(c.text)+'</p></details>':'<p>'+esc(c.text)+'</p>')+'</div></article>';
}
async function changeComment(id,action){
 if(feedback.pending.has(id))return;
 feedback.pending.add(id);sched();
 try{
  let voterId=store.get('commentVoterId');if(!voterId){voterId=crypto.randomUUID();store.set('commentVoterId',voterId)}
  const r=await fetch('/api/comments',{method:'POST',headers:{'Content-Type':'application/json',...(action==='delete'&&W()?{'X-Edit-Password':G.token}:{})},body:JSON.stringify({action,id,...(action==='vote'?{voterId,voted:store.get('commentVote.'+id)!=='yes'}:{ownerKey:commentOwnerKey()})})});
  const data=await r.json();if(!r.ok)throw new Error(data.message||'Không lưu được thay đổi.');auditNotice(r);
  if(action==='delete')feedback.items=feedback.items.filter(c=>c.id!==id);
  else{feedback.items=feedback.items.map(c=>c.id===id?data.comment:c);store.set('commentVote.'+id,data.voted?'yes':'no')}
 }finally{feedback.pending.delete(id);sched()}
}
function viewYKien(){
  return '<div class="bar"><div class="grow"><h2>Ý kiến của lớp</h2><p class="sub">Mọi người đều có thể gửi ý kiến, không cần bật Edit mode. Ý kiến được chia sẻ với cả lớp.</p></div><button class="btn" data-act="commentsRefresh" '+(feedback.busy?'disabled':'')+'>Làm mới</button><button class="btn primary" data-act="commentAdd" aria-label="Thêm ý kiến">＋ Thêm ý kiến</button></div>'+(feedback.error?'<p class="notice warn" role="alert">'+esc(feedback.error)+'</p>':'')+(feedback.busy?'<p class="sub" role="status">Đang tải ý kiến…</p>':'')+'<div class="feedback-list">'+(feedback.items.length?feedback.items.slice().sort((a,b)=>b.createdAt-a.createdAt).map(feedbackCard).join(''):feedback.loaded?'<div class="empty"><h3>Chưa có ý kiến</h3><p>Bấm ＋ để chia sẻ ý kiến đầu tiên với cả lớp.</p></div>':'')+'</div>';
}
async function loadComments(){
  if(feedback.busy)return;feedback.busy=true;feedback.error='';sched();
  try{const r=await fetch('/api/comments',{cache:'no-store'});const data=await r.json();if(!r.ok)throw new Error(data.message||'Không tải được ý kiến.');feedback.items=Array.isArray(data.comments)?data.comments.filter(c=>c&&typeof c.text==='string'):[];feedback.loaded=true;}
  catch(e){feedback.error=e.message}finally{feedback.busy=false;sched();}
}
Object.assign(act,{
  commentEdit:el=>{const c=feedback.items.find(c=>c.id===el.dataset.id);if(!c||(!W()&&store.get('commentOwned.'+c.id)!=='yes'))return;openForm({title:'Sửa ý kiến',submit:'Lưu thay đổi',fields:[{name:'name',label:'Tên người đăng',required:true,value:c.name},{name:'text',label:'Ý kiến',type:'textarea',rows:9,required:true,value:c.text,hint:'Tối đa 20.000 ký tự.'}],onSubmit:async v=>{
    if(v.name.length>80||v.text.length>20000)throw new Error('Tên tối đa 80 ký tự, ý kiến tối đa 20.000 ký tự.');
    const r=await fetch('/api/comments',{method:'POST',headers:{'Content-Type':'application/json',...(W()?{'X-Edit-Password':G.token}:{})},body:JSON.stringify({action:'edit',id:c.id,name:v.name,text:v.text,ownerKey:commentOwnerKey()})});const data=await r.json();if(!r.ok)throw new Error(data.message||'Không sửa được ý kiến.');auditNotice(r);feedback.items=feedback.items.map(item=>item.id===c.id?data.comment:item);sched();
  }})},
  commentVote:el=>changeComment(el.dataset.id,'vote'),
  commentDelete:el=>{if(!W()&&store.get('commentOwned.'+el.dataset.id)!=='yes')return;const comment=feedback.items.find(c=>c.id===el.dataset.id);if(!comment)return;confirmBox('Xoá ý kiến?','Ý kiến của “'+comment.name+'”: “'+comment.text+'” và các lượt vote sẽ bị xoá.','Xoá',()=>changeComment(el.dataset.id,'delete'));},
  commentsRefresh:()=>loadComments(),
  commentAdd:()=>openForm({title:'Thêm ý kiến',submit:'Gửi ý kiến',intro:'Ý kiến được hiển thị công khai cho cả lớp. Bạn có thể bấm ＋ để gửi thêm ý kiến khác.',fields:[{name:'name',label:'Tên của bạn',required:true,value:store.get('commentName')||'',hint:'Tối đa 80 ký tự.'},{name:'text',label:'Ý kiến',type:'textarea',rows:5,required:true,hint:'Tối đa 20.000 ký tự.'}],onSubmit:async v=>{
    if(v.name.length>80||v.text.length>20000)throw new Error('Tên tối đa 80 ký tự, ý kiến tối đa 20.000 ký tự.');
    const r=await fetch('/api/comments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:v.name,text:v.text,ownerKey:commentOwnerKey()})});const data=await r.json();if(!r.ok)throw new Error(data.message||'Không gửi được ý kiến.');
    auditNotice(r);store.set('commentOwned.'+data.comment.id,'yes');store.set('commentName',v.name);feedback.items.push(data.comment);feedback.loaded=true;feedback.error='';
  }})
});
const news={sources:[],cache:{},saved:[],mode:'new',busy:false,errors:[],message:''};
function readLocalJson(key,fallback){try{const value=JSON.parse(store.get(key)||'null');if(!value)return fallback;if(Array.isArray(fallback)&&!Array.isArray(value))return fallback;if(fallback&&typeof fallback==='object'&&!Array.isArray(fallback)&&(typeof value!=='object'||Array.isArray(value)))return fallback;return value}catch{return fallback}}
news.sources=readLocalJson('newsSources',[]).filter(x=>typeof x==='string').slice(0,12);
news.cache=readLocalJson('newsCache',{});
news.saved=readLocalJson('newsSaved',[]).filter(x=>x&&typeof x.link==='string');
if(!news.sources.length&&store.get('rssUrl')){
  news.sources=[store.get('rssUrl')];store.set('newsSources',JSON.stringify(news.sources));
  const old=readLocalJson('rssCache',null);if(old)news.cache[old.url]=old;
  store.set('rssUrl','');store.set('rssCache','');
}
function saveNewsLocal(){
  try{localStorage.setItem('solop.newsSources',JSON.stringify(news.sources));localStorage.setItem('solop.newsCache',JSON.stringify(news.cache));localStorage.setItem('solop.newsSaved',JSON.stringify(news.saved));}
  catch{throw new Error('Không lưu được tin trên thiết bị. Bộ nhớ trình duyệt đã đầy hoặc bị chặn.');}
}
function newsLabel(url){try{const u=new URL(url);return u.hostname+u.pathname.replace(/\/$/,'')}catch{return url}}
function newsItems(){
  if(news.mode==='saved')return news.saved;
  const seen=new Set();return news.sources.flatMap(source=>(news.cache[source]?.items||[]).map(item=>({...item,source}))).filter(item=>{if(seen.has(item.link))return false;seen.add(item.link);return true}).sort((a,b)=>(Date.parse(b.date)||0)-(Date.parse(a.date)||0));
}
function viewTinMoi(){
  const items=newsItems();
  return '<div class="bar news-heading"><div class="grow"><h2>Điểm tin công nghệ</h2><p class="sub">Theo dõi bài viết mới từ RSS/Atom và website bạn chọn.</p></div><div class="news-switch" role="group" aria-label="Loại tin"><button class="btn '+(news.mode==='new'?'primary':'')+'" data-act="newsMode" data-mode="new" aria-pressed="'+(news.mode==='new')+'">Tin mới</button><button class="btn '+(news.mode==='saved'?'primary':'')+'" data-act="newsMode" data-mode="saved" aria-pressed="'+(news.mode==='saved')+'">Tin đã lưu</button></div></div>'
  +'<section class="panel news-sources"><h3>▤ Nguồn tin</h3><div class="source-tags">'+news.sources.map((source,i)=>'<span class="source-tag"><span>'+esc(newsLabel(source))+'</span><button class="source-remove" data-act="newsRemove" data-i="'+i+'" aria-label="Xóa nguồn '+esc(newsLabel(source))+'">×</button></span>').join('')+'</div><form id="newsSourceForm" class="source-form"><label class="sr-only" for="newsSourceInput">Đường dẫn RSS hoặc website</label><input id="newsSourceInput" name="source" placeholder="vd: vnexpress.net/rss/so-hoa.rss" autocomplete="url" required><button class="btn" type="submit">＋ Thêm</button></form><button class="btn primary" data-act="newsRefresh" '+(news.busy?'disabled':'')+'>'+(news.busy?'Đang đọc tin…':'▤ Đọc tin mới')+'</button><p class="sub news-local">Nguồn tin, cache và bài đã lưu chỉ nằm trên trình duyệt của thiết bị này.</p>'+(news.errors.length?'<p class="err" role="status">'+news.errors.map(esc).join('<br>')+'</p>':'')+(news.message?'<p class="sub" role="status">'+esc(news.message)+'</p>':'')+'</section>'
  +'<div class="news-articles">'+(items.length?items.map((item,i)=>{const saved=news.saved.some(n=>n.link===item.link);return '<article class="news-article"><div class="news-meta"><span class="tag plain">'+esc(item.category||'Tin tức')+'</span> '+esc(newsLabel(item.source||''))+(item.date?' · '+esc(Number.isNaN(Date.parse(item.date))?item.date:stamp(Date.parse(item.date))):'')+'</div><h3><a href="'+esc(safeNewsLink(item.link))+'" target="_blank" rel="noopener noreferrer">'+esc(item.title)+'</a></h3>'+(item.description?'<p>'+esc(item.description)+'</p>':'')+'<div class="news-foot"><button class="save-news '+(saved?'is-saved':'')+'" data-act="newsSave" data-i="'+i+'" aria-pressed="'+saved+'" aria-label="'+(saved?'Bỏ lưu':'Lưu bài viết')+'">'+(saved?'★':'☆')+'</button></div></article>'}).join(''):'<div class="empty"><h3>'+(news.mode==='saved'?'Chưa có tin đã lưu':'Chưa có bản tin')+'</h3><p>'+(news.mode==='saved'?'Bấm ngôi sao trên bài viết để lưu tại thiết bị này.':'Thêm nguồn RSS hoặc website, rồi bấm Đọc tin mới.')+'</p></div>')+'</div>';
}
async function addNewsSource(value){
  const source=new URL(/^https?:\/\//i.test(value)?value:'https://'+value);
  if(source.protocol!=='https:'||source.username||source.password)throw new Error('Vui lòng nhập link HTTPS công khai.');
  source.hash='';const url=source.href;
  if(news.sources.includes(url)){news.message='Nguồn tin này đã có trong danh sách.';render();return;}
  if(news.sources.length>=12)throw new Error('Tối đa 12 nguồn tin trên thiết bị.');
  news.sources.push(url);saveNewsLocal();news.message='Đã thêm nguồn tin trên thiết bị này.';render();
}
function feedText(value){const doc=new DOMParser().parseFromString(value||'','text/html');return (doc.body.textContent||'').replace(/\s+/g,' ').trim().slice(0,400)}
async function refreshNews(force=false){
  if(news.busy||!news.sources.length)return;news.busy=true;news.errors=[];news.message='';sched();
  const sources=[...news.sources];
  try{
    // Two at a time keeps the page responsive with several sources.
    for(let i=0;i<sources.length;i+=2)await Promise.all(sources.slice(i,i+2).map(async source=>{
      if(!force&&news.cache[source]&&Date.now()-news.cache[source].savedAt<15*60000)return;
      try{
        const r=await fetch('/api/rss?url='+encodeURIComponent(source),{cache:'no-store'});const data=await r.json();if(!r.ok)throw new Error(data.message||'Không đọc được nguồn tin.');
        const xml=new DOMParser().parseFromString(data.xml,'text/xml');if(xml.querySelector('parsererror')||!xml.querySelector('rss,feed,RDF'))throw new Error('Không tìm thấy RSS/Atom hợp lệ.');
        const items=[...xml.querySelectorAll('item,entry')].slice(0,20).map(n=>{
          const rawLink=n.querySelector('link[rel="alternate"]')?.getAttribute('href')||n.querySelector('link')?.getAttribute('href')||n.querySelector('link')?.textContent||'';
          let link='#';try{link=safeNewsLink(new URL(rawLink,data.feedUrl||source).href)}catch{}
          return {title:n.querySelector('title')?.textContent||'Bản tin',link,description:feedText(n.querySelector('description,summary')?.textContent),category:n.querySelector('category')?.getAttribute('term')||n.querySelector('category')?.textContent||'',date:n.querySelector('pubDate,published,updated')?.textContent||'',source};
        }).filter(n=>n.link!=='#');
        if(news.sources.includes(source))news.cache[source]={items,savedAt:Date.now()};
      }catch(e){news.errors.push(newsLabel(source)+': '+e.message+' Giữ bản cache nếu có.');}
    }));
    saveNewsLocal();news.message='Đã kiểm tra nguồn tin. Cache lưu riêng trên thiết bị.';
  }catch(e){news.errors.push(e.message)}finally{news.busy=false;sched();}
}
Object.assign(act,{
  newsRefresh:()=>refreshNews(true),
  newsMode:el=>{news.mode=el.dataset.mode==='saved'?'saved':'new';render()},
  newsRemove:el=>{const source=news.sources[Number(el.dataset.i)];if(!source)return;confirmBox('Xóa nguồn tin?','Nguồn “'+newsLabel(source)+'” và cache của nguồn này sẽ bị xóa khỏi thiết bị. Tin đã lưu vẫn được giữ.','Xóa',()=>{news.sources=news.sources.filter(n=>n!==source);delete news.cache[source];saveNewsLocal();});},
  newsSave:el=>{const item=newsItems()[Number(el.dataset.i)];if(!item)return;const i=news.saved.findIndex(n=>n.link===item.link);if(i>=0){confirmBox('Xoá tin đã lưu?','Tin “'+item.title+'” sẽ bị xoá khỏi danh sách đã lưu trên thiết bị.','Xoá',()=>{news.saved=news.saved.filter(n=>n.link!==item.link);saveNewsLocal();render()});return;}news.saved.unshift({...item});saveNewsLocal();render()}
});
document.addEventListener('submit',async event=>{
  if(event.target.id!=='newsSourceForm')return;event.preventDefault();
  try{await addNewsSource(event.target.elements.source.value.trim())}catch(e){news.errors=[e.message];render()}
});


document.addEventListener('click',async ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;
  const fn=act[el.dataset.act];if(!fn)return;
  const readActions=['exportCourseWord','syncNow','rosterRefresh','rosterGroup','reportSubmit','reportsRefresh','reportSelect','commentAdd','commentVote','commentEdit','commentDelete','commentsRefresh','newsAdd','newsRemove','newsRefresh','newsMode','newsSave','notifications','editMode','tab','closeModal','calPrev','calNext','calToday','selDay','openFolder','openCourse','backCourses','selLecture','openAlbum','backAlbums','openPhoto','openLecImg','lbClose','lbPrev','lbNext'];
  if(!S.editMode&&!readActions.includes(el.dataset.act)){toast('Vui lòng bật Edit mode.');return}
  try{await fn(el,ev)}catch(e){toast(friendly(e))}
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){checkUpdates();refreshNews();}});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){if(!$('#modal').hidden)closeModal();else if(S.lb){S.lb=null;renderLb()}}
  if(S.lb&&$('#modal').hidden&&S.lb.ids.length>1){if(ev.key==='ArrowLeft')act.lbPrev();if(ev.key==='ArrowRight')act.lbNext()}
});
document.addEventListener('error',ev=>{if(ev.target&&ev.target.tagName==='IMG')ev.target.classList.add('broken')},true);
init();
})();
</script>
